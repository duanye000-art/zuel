<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>登录 - 请销假证明系统</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", SimHei, sans-serif;
  background: linear-gradient(135deg, #e8f4fd 0%, #f3f3f3 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 0;
}

/* ── 通用卡片 ── */
.panel {
  display: none;
  background: white;
  width: 340px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,112,192,0.18);
  overflow: hidden;
}
.panel.active { display: block; }

.panel-header {
  color: white;
  text-align: center;
  padding: 24px 20px 18px;
}
.panel-header.blue  { background: #0070c0; }
.panel-header.green { background: #354d3f; }
.panel-header h1 { font-size: 18px; font-weight: bold; letter-spacing: 1px; margin-bottom: 4px; }
.panel-header h2 { font-size: 16px; font-weight: bold; }
.panel-header p  { font-size: 12px; opacity: 0.85; }

.panel-body { padding: 24px 24px 18px; }

/* ── 表单 ── */
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 13px; color: #555;
  margin-bottom: 5px; font-weight: bold;
}
.form-group input {
  width: 100%; border: 1.5px solid #ddd; border-radius: 6px;
  padding: 9px 12px; font-size: 14px; font-family: inherit;
  outline: none; transition: border-color 0.2s; background: #fafff7;
}
.form-group input:focus { border-color: #0070c0; background: #f0f8ff; }
.field-note { font-size: 11px; color: #aaa; margin-top: 3px; }

/* ── 按钮 ── */
.btn {
  width: 100%; border: none; border-radius: 6px; padding: 12px;
  font-size: 15px; font-family: inherit; font-weight: bold;
  letter-spacing: 1px; cursor: pointer; transition: background 0.2s, transform 0.1s;
}
.btn:active { transform: scale(0.98); }
.btn-blue  { background: #0070c0; color: white; box-shadow: 0 4px 12px rgba(0,112,192,0.3); }
.btn-blue:hover  { background: #005fa3; }
.btn-green { background: #354d3f; color: white; }
.btn-green:hover { background: #2a3d30; }

/* ── 消息 ── */
.msg { font-size: 12px; text-align: center; margin-top: 8px; min-height: 18px; }
.msg.err { color: #c00; }
.msg.ok  { color: #090; }

/* ── 链接 ── */
.links { margin-top: 14px; padding-top: 14px; border-top: 1px solid #eee; text-align: center; }
.links a { font-size: 12px; color: #888; text-decoration: none; cursor: pointer; }
.links a:hover { color: #0070c0; text-decoration: underline; }
.back-link { text-align: center; margin-top: 14px; }
.back-link a { font-size: 12px; color: #888; cursor: pointer; }
.back-link a:hover { color: #0070c0; text-decoration: underline; }

/* ── 选项卡 ── */
.tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 18px; }
.tab {
  flex: 1; text-align: center; padding: 9px 0; font-size: 12px;
  color: #888; cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -2px; transition: color 0.15s; user-select: none;
}
.tab.active { color: #354d3f; border-bottom-color: #354d3f; font-weight: bold; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ── 账号列表 ── */
.account-list { max-height: 260px; overflow-y: auto; }
.account-item {
  display: flex; align-items: center; justify-content: space-between;
  background: #f7f7f7; border: 1px solid #e8e8e8; border-radius: 7px;
  padding: 9px 10px; margin-bottom: 8px;
}
.acc-name { font-size: 13px; font-weight: bold; color: #333; }
.acc-pass { font-size: 11px; color: #aaa; margin-top: 2px; }
.acc-badge {
  display: inline-block; font-size: 10px; padding: 1px 5px;
  border-radius: 3px; margin-left: 5px; color: white; background: #354d3f;
  vertical-align: middle;
}
.del-btn {
  flex-shrink: 0; border: 1px solid #c0392b; background: none;
  color: #c0392b; border-radius: 5px; padding: 4px 10px;
  font-size: 12px; cursor: pointer; transition: background 0.15s, color 0.15s;
}
.del-btn:hover { background: #c0392b; color: white; }
.del-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.empty-hint { font-size: 12px; color: #bbb; text-align: center; padding: 12px 0; }

.footer { margin-top: 20px; color: #aaa; font-size: 11px; text-align: center; }
</style>
</head>
<body>

<!-- ══ 登录面板 ══ -->
<div class="panel active" id="panel-login">
  <div class="panel-header blue">
    <h1>本科学生请销假证明</h1>
    <p>管理员QQ：2239353140</p>
  </div>
  <div class="panel-body">
    <div class="form-group">
      <label>账号</label>
      <input type="text" id="login-user" placeholder="请输入账号" autocomplete="username">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="login-pass" placeholder="请输入密码"
             autocomplete="current-password"
             onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-blue" onclick="doLogin()">登 录</button>
    <div class="msg err" id="login-err"></div>
    <div class="links">
      <a onclick="showPanel('panel-admin')">⚙️ 管理员设置</a>
    </div>
  </div>
</div>

<!-- ══ 管理面板 ══ -->
<div class="panel" id="panel-admin">
  <div class="panel-header green">
    <h2>⚙️ 管理员设置</h2>
  </div>
  <div class="panel-body">

    <!-- Step 1：验证管理密钥 -->
    <div id="admin-auth">
      <p style="font-size:12px;color:#666;margin-bottom:14px;line-height:1.6;">
        请输入管理密钥进入管理面板。<br>首次使用请留空直接进入。
      </p>
      <div class="form-group">
        <label>管理密钥</label>
        <input type="password" id="admin-key-input" placeholder="管理密钥（首次留空）"
               onkeydown="if(event.key==='Enter')verifyKey()">
      </div>
      <button class="btn btn-green" onclick="verifyKey()">进 入 管 理</button>
      <div class="msg err" id="auth-err"></div>
      <div class="back-link"><a onclick="showPanel('panel-login')">← 返回登录</a></div>
    </div>

    <!-- Step 2：管理内容 -->
    <div id="admin-main" style="display:none">
      <div class="tabs">
        <div class="tab active" onclick="switchTab(0)">账号列表</div>
        <div class="tab" onclick="switchTab(1)">添加账号</div>
        <div class="tab" onclick="switchTab(2)">系统设置</div>
      </div>

      <!-- 账号列表 -->
      <div class="tab-pane active" id="tp-0">
        <div class="account-list" id="account-list"></div>
        <div class="msg" id="list-msg"></div>
      </div>

      <!-- 添加账号 -->
      <div class="tab-pane" id="tp-1">
        <div class="form-group">
          <label>新账号</label>
          <input type="text" id="add-user" placeholder="设置登录账号">
        </div>
        <div class="form-group">
          <label>新密码</label>
          <input type="password" id="add-pass" placeholder="设置登录密码">
        </div>
        <button class="btn btn-green" onclick="addAccount()">添 加 账 号</button>
        <div class="msg" id="add-msg"></div>
      </div>

      <!-- 系统设置 -->
      <div class="tab-pane" id="tp-2">
        <div class="form-group">
          <label>新管理密钥</label>
          <input type="password" id="new-key" placeholder="设置新管理密钥">
          <div class="field-note">留空则取消管理密钥保护</div>
        </div>
        <button class="btn btn-green" onclick="saveKey()">保 存 密 钥</button>
        <div class="msg" id="key-msg"></div>
      </div>

      <div class="back-link" style="margin-top:16px">
        <a onclick="exitAdmin()">← 退出管理，返回登录</a>
      </div>
    </div>

  </div>
</div>

<div class="footer">开发者qq:2239353140.</div>

<script>
var SK_ACC = 'qxj_accounts';
var SK_KEY = 'qxj_admin_key';

/* ── 数据读写 ── */
function loadAccounts() {
  try {
    var raw = localStorage.getItem(SK_ACC);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return [{ user: 'admin', pass: '123456', master: true }];
}
function saveAccounts(list) {
  localStorage.setItem(SK_ACC, JSON.stringify(list));
}
function getKey() { return localStorage.getItem(SK_KEY) || ''; }
function setKey(k) { localStorage.setItem(SK_KEY, k); }

/* ── 面板切换 ── */
function showPanel(id) {
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  if (id === 'panel-admin') {
    document.getElementById('admin-auth').style.display = 'block';
    document.getElementById('admin-main').style.display = 'none';
    document.getElementById('admin-key-input').value = '';
    document.getElementById('auth-err').textContent = '';
  }
}

/* ── 登录 ── */
function doLogin() {
  var u = document.getElementById('login-user').value.trim();
  var p = document.getElementById('login-pass').value;
  var accounts = loadAccounts();
  var ok = accounts.some(function(a){ return a.user === u && a.pass === p; });
  if (ok) {
    sessionStorage.setItem('qxj_auth', '1');
    window.location.href = 'index.html';
  } else {
    document.getElementById('login-err').textContent = '账号或密码错误，请重试。';
    document.getElementById('login-pass').value = '';
    document.getElementById('login-pass').focus();
  }
}

/* ── 管理密钥验证 ── */
function verifyKey() {
  var input = document.getElementById('admin-key-input').value;
  var stored = getKey();
  if (stored !== '' && input !== stored) {
    document.getElementById('auth-err').textContent = '管理密钥错误。';
    return;
  }
  document.getElementById('admin-auth').style.display = 'none';
  document.getElementById('admin-main').style.display = 'block';
  switchTab(0);
}

function exitAdmin() {
  showPanel('panel-login');
  document.getElementById('login-err').textContent = '';
}

/* ── 选项卡 ── */
function switchTab(idx) {
  document.querySelectorAll('.tab').forEach(function(t, i){
    t.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.tab-pane').forEach(function(p, i){
    p.classList.toggle('active', i === idx);
  });
  ['list-msg','add-msg','key-msg'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) { el.textContent = ''; el.className = 'msg'; }
  });
  if (idx === 0) renderList();
}

/* ── 渲染账号列表 ── */
function renderList() {
  var accounts = loadAccounts();
  var el = document.getElementById('account-list');
  if (!accounts.length) {
    el.innerHTML = '<div class="empty-hint">暂无账号</div>';
    return;
  }
  el.innerHTML = accounts.map(function(acc, i) {
    var badge = acc.master ? '<span class="acc-badge">主账号</span>' : '';
    var disabled = acc.master ? 'disabled' : '';
    return '<div class="account-item">' +
      '<div>' +
        '<div class="acc-name">' + esc(acc.user) + badge + '</div>' +
        '<div class="acc-pass">密码：' + maskPass(acc.pass) + '</div>' +
      '</div>' +
      '<button class="del-btn" ' + disabled + ' onclick="delAccount(' + i + ')">删除</button>' +
    '</div>';
  }).join('');
}

/* ── 添加账号 ── */
function addAccount() {
  var u = document.getElementById('add-user').value.trim();
  var p = document.getElementById('add-pass').value;
  if (!u) { msg('add-msg', '账号不能为空。', 'err'); return; }
  if (!p) { msg('add-msg', '密码不能为空。', 'err'); return; }
  var accounts = loadAccounts();
  if (accounts.some(function(a){ return a.user === u; })) {
    msg('add-msg', '账号"' + u + '"已存在。', 'err'); return;
  }
  accounts.push({ user: u, pass: p, master: false });
  saveAccounts(accounts);
  document.getElementById('add-user').value = '';
  document.getElementById('add-pass').value = '';
  msg('add-msg', '✅ 账号"' + u + '"添加成功！', 'ok');
}

/* ── 删除账号 ── */
function delAccount(i) {
  var accounts = loadAccounts();
  var acc = accounts[i];
  if (!acc || acc.master) { msg('list-msg', '主账号不可删除。', 'err'); return; }
  if (!confirm('确定要删除账号"' + acc.user + '"吗？')) return;
  accounts.splice(i, 1);
  saveAccounts(accounts);
  msg('list-msg', '✅ 账号"' + acc.user + '"已删除。', 'ok');
  renderList();
}

/* ── 保存管理密钥 ── */
function saveKey() {
  var k = document.getElementById('new-key').value;
  setKey(k);
  document.getElementById('new-key').value = '';
  msg('key-msg', k ? '✅ 管理密钥已更新。' : '✅ 已取消管理密钥保护。', 'ok');
}

/* ── 工具 ── */
function msg(id, text, type) {
  var el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = 'msg ' + (type || '');
}
function maskPass(p) { return p ? p[0] + '****' : ''; }
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
