<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生成请销假证明</title>
  <style>
    body {font-family: system-ui, sans-serif; background:#f8f9fa; padding:40px; max-width:800px; margin:0 auto;}
    h1 {color:#e63939; text-align:center;}
    form {background:white; padding:40px; border-radius:12px; box-shadow:0 4px 25px rgba(0,0,0,0.1);}
    label {display:block; margin:18px 0 8px; font-weight:bold; color:#333;}
    input, select, textarea {width:100%; padding:12px; border:1px solid #ccc; border-radius:6px; font-size:16px;}
    button {background:#e63939; color:white; padding:16px; font-size:18px; border:none; border-radius:8px; cursor:pointer; margin-top:30px; width:100%;}
    button:hover {background:#c22a2a;}
  </style>
</head>
<body>
  <h1>生成你的请销假证明</h1>
  <form id="form">
    <label>学院</label><input type="text" id="college" value="刑事司法学院">
    <label>姓名</label><input type="text" id="name" value="段烨">
    <label>学号</label><input type="text" id="studentId" value="202421050004">
    <label>专业</label><input type="text" id="major" value="侦查学(法庭科学方向)">
    <label>班级</label><input type="text" id="class" value="法科2401">
    <label>请假类型</label>
    <select id="leaveType">
      <option value="病假" selected>病假</option>
      <option value="事假">事假</option>
    </select>
    <label>开始日期</label><input type="date" id="startDate" value="2026-04-01">
    <label>结束日期</label><input type="date" id="endDate" value="2026-04-01">
    <label>请假原因</label><textarea id="reason" rows="3">身体不适</textarea>
    <button type="submit">生成证明</button>
  </form>

  <script>
    document.getElementById("form").onsubmit = function(e) {
      e.preventDefault();
      const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>本科生请销假证明</title><style>body{font-family:system-ui;padding:50px;max-width:800px;margin:auto;line-height:1.8;}</style></head><body>
        <h1 style="color:#e63939;text-align:center;">本科学生请销假证明</h1>
        <p><strong>学院：</strong>${document.getElementById("college").value}</p>
        <p><strong>姓名：</strong>${document.getElementById("name").value}</p>
        <p><strong>学号：</strong>${document.getElementById("studentId").value}</p>
        <p><strong>专业：</strong>${document.getElementById("major").value}</p>
        <p><strong>班级：</strong>${document.getElementById("class").value}</p>
        <p><strong>请假类型：</strong>${document.getElementById("leaveType").value}</p>
        <p><strong>请假时限：</strong>${document.getElementById("startDate").value} 至 ${document.getElementById("endDate").value}</p>
        <p><strong>请假原因：</strong>${document.getElementById("reason").value}</p>
        <hr><p style="text-align:center;color:#666;margin-top:60px;">此证明由 page1.bzy123.us.ci 生成</p>
      </body></html>`;
      const win = window.open();
      win.document.write(html);
    };
  </script>
</body>
</html>
