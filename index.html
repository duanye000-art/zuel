<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>证明模板</title>
    <style>
        body {
            font-family: "SimSun", "宋体", serif;
            margin: 0;
            padding: 20px;
            background: #f4f4f4;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            gap: 40px;
        }
        .left {
            flex: 1;
            /* 左侧固定内容样式，根据你的原代码调整 */
        }
        .right {
            flex: 1;
            /* 右侧信息栏 */
        }
        .info-row {
            margin-bottom: 15px;
        }
        .info-row label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        .info-row input {
            width: 280px;
            padding: 6px;
            border: 1px solid #999;
            font-size: 16px;
        }
        button {
            margin-top: 30px;
            padding: 12px 30px;
            font-size: 18px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        /* 打印友好样式（新窗口会使用） */
        @media print {
            body { background: white; }
            .container { box-shadow: none; border: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 左侧固定内容（请替换为你原代码的左侧部分） -->
    <div class="left">
        <h1 style="text-align:center;">XXX证明</h1>
        <p style="text-align:center; font-size:18px;">兹证明</p>
        <!-- ... 你的原左侧文本、印章位置等 ... -->
        <p>以上情况属实，特此证明。</p>
        <p style="text-align:right;">证明单位：XXXXXXXX</p>
        <p style="text-align:right;">日期：2026年</p>
    </div>

    <!-- 右侧可修改信息栏（原代码中姓名、电话等位置） -->
    <div class="right">
        <div class="info-row">
            <label>姓名：</label>
            <input type="text" id="name" value="张三" placeholder="请输入姓名">
        </div>
        <div class="info-row">
            <label>电话：</label>
            <input type="text" id="phone" value="13800138000" placeholder="请输入电话">
        </div>
        <div class="info-row">
            <label>身份证号：</label>
            <input type="text" id="idcard" value="440123199001011234" placeholder="请输入身份证号">
        </div>
        <!-- 添加更多你需要的字段，例如： -->
        <!-- <div class="info-row">
            <label>其他信息：</label>
            <input type="text" id="other" value="默认值">
        </div> -->

        <button onclick="generateCertificate()">生成证明</button>
    </div>
</div>

<script>
function generateCertificate() {
    // 收集输入值
    const name = document.getElementById('name').value || '未填写';
    const phone = document.getElementById('phone').value || '未填写';
    const idcard = document.getElementById('idcard').value || '未填写';
    // 如果有更多字段，继续添加 const xxx = ... 

    // 生成新窗口的完整HTML（样式与原页面完全一致，只是信息部分换成填好的文本）
    const newHTML = `
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>生成的证明</title>
    <style>
        body { font-family: "SimSun", "宋体", serif; margin:0; padding:40px; background:#fff; }
        .container { max-width:1000px; margin:0 auto; background:white; padding:40px; border:1px solid #ccc; }
        .left { text-align:justify; line-height:1.8; }
        .right { margin-top:20px; }
        .info-row { margin:12px 0; font-size:18px; }
        .info-row span { font-weight:bold; margin-right:10px; }
        @media print { body { background:white; } .container { box-shadow:none; border:none; } }
    </style>
</head>
<body>
<div class="container">
    <div class="left">
        <h1 style="text-align:center;">XXX证明</h1>
        <p style="text-align:center; font-size:18px;">兹证明</p>
        <!-- 左侧固定内容，与原页面相同 -->
        <p>以上情况属实，特此证明。</p>
        <p style="text-align:right;">证明单位：XXXXXXXX</p>
        <p style="text-align:right;">日期：2026年</p>
    </div>
    
    <div class="right">
        <div class="info-row"><span>姓名：</span>${name}</div>
        <div class="info-row"><span>电话：</span>${phone}</div>
        <div class="info-row"><span>身份证号：</span>${idcard}</div>
        <!-- 更多字段请在这里对应添加 -->
    </div>
</div>
</body>
</html>`;

    // 打开新窗口并写入内容
    const newWindow = window.open('', '_blank', 'width=1100,height=800,scrollbars=yes,resizable=yes');
    if (newWindow) {
        newWindow.document.write(newHTML);
        newWindow.document.close();
        // 可选：自动触发打印对话框
        // newWindow.print();
    } else {
        alert('弹出窗口被浏览器阻止，请允许弹出窗口后再试！');
    }
}
</script>

</body>
</html>
