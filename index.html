    <!DOCTYPE html>
    <html lang="zh-CN">
    <head>
      <meta charset="UTF-8">

      <title>生成请销假证明</title>
      <style>
        body {font-family: system-ui, sans-serif; background:#f8f9fa; padding:20px; max-width:800px; margin:0 auto;}
        h1 {color:#e63939; text-align:center;}
        form {background:white; padding:30px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.1);}
        label {display:block; margin:15px 0 5px; font-weight:bold;}
        input, select, textarea {width:100%; padding:12px; border:1px solid #ddd; border-radius:6px; font-size:16px; box-sizing:border-box;}

    </head>
    <body>
      <h1>生成你的请销假证明</h1>
      <form id="generateForm">
        <label>学院</label><input type="text" id="college" value="刑事司法学院" required>
        <label>姓名</label><input type="text" id="name" value="段烨" required>

        <label>QQ</label><input type="text" id="qq" value="2095728221" required>

        <select id="leaveType">
          <option value="事假">事假</option>
          <option value="病假" selected>病假</option>
          <option value="其他类型">其他类型</option>
        </select>
        <label>请假开始日期</label><input type="date" id="startDate" value="2026-04-01" required>
        <label>请假结束日期</label><input type="date" id="endDate" value="2026-04-01" required>
        <label>请假原因</label><textarea id="reason" rows="3" required>身体不适</textarea>
        <button type="submit">生成证明</button>

      <script>
        document.getElementById("generateForm").onsubmit = function(e) {
          e.preventDefault();
          const data = {
            college: document.getElementById("college").value,
            name: document.getElementById("name").value,
            studentId: document.getElementById("studentId").value,
            major: document.getElementById("major").value,
            class: document.getElementById("class").value,
            grade: document.getElementById("grade").value,
            phone: document.getElementById("phone").value,
            qq: document.getElementById("qq").value,
            leaveType: document.getElementById("leaveType").value,

            <style>body{font-family: system-ui; padding:40px; max-width:800px; margin:auto; background:#f8f9fa; line-height:1.8;}</style>

              <p><strong>学号：</strong>${data.studentId}</p>
              <p><strong>专业：</strong>${data.major}</p>
              <p><strong>班级：</strong>${data.class}</p>
              <p><strong>年级：</strong>${data.grade}</p>
              <p><strong>电话：</strong>${data.phone}</p>
              <p><strong>QQ：</strong>${data.qq}</p>
              <p><strong>请假类型：</strong>${data.leaveType}</p>
              <p><strong>请假时限：</strong>${data.startDate} 至 ${data.endDate}</p>
              <p><strong>请假原因：</strong>${data.reason}</p>
              <hr style="margin:40px 0;">
              <p style="text-align:center; color:#666;">此证明由 page1.bzy123.us.ci 生成 • ${new Date().toLocaleDateString('zh-CN')}</p>
            </body></html>
          `;

          const newWin = window.open();
          newWin.document.write(resultHTML);
          newWin.document.close();
