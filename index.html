<!DOCTYPE html>
<html>
<head>
<meta charset=utf-8>
<title>本科生请销假证明</title>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
/* 保留你原来的所有样式，让页面看起来几乎一模一样 */
body{font-family:"Microsoft YaHei",SimSun,sans-serif;background:#f3f3f3!important;margin:0;padding:20px;}
.container{max-width:820px;margin:auto;background:white;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,0.1);}
h1{text-align:center;color:#000;font-size:24pt;margin-bottom:0;}
table{width:100%;border-collapse:collapse;margin:20px 0;}
td{padding:12px 15px;border:1px solid #bfbfbf;vertical-align:middle;}
.label{background:#f8f9fa;font-weight:bold;width:160px;text-align:center;}
input,select,textarea{width:100%;padding:10px;font-size:16px;border:1px solid #ccc;box-sizing:border-box;}
button{background:#e63939;color:white;padding:18px 50px;font-size:20px;border:none;border-radius:8px;cursor:pointer;margin:40px auto 0;display:block;}
button:hover{background:#c22a2a;}
</style>
</head>
<body>
<div class="container">
  <h1>本科学生请销假证明</h1>
  
  <table>
    <tr><td class="label">学院</td><td><input type="text" id="college" value="刑事司法学院"></td></tr>
    <tr><td class="label">姓名</td><td><input type="text" id="name" value="段烨"></td></tr>
    <tr><td class="label">学号</td><td><input type="text" id="studentId" value="202421050004"></td></tr>
    <tr><td class="label">专业</td><td><input type="text" id="major" value="侦查学(法庭科学方向)"></td></tr>
    <tr><td class="label">班级</td><td><input type="text" id="class" value="法科2401"></td></tr>
    <tr><td class="label">年级</td><td><input type="text" id="grade" value="2024"></td></tr>
    <tr><td class="label">电话</td><td><input type="text" id="phone" value="19357494523"></td></tr>
    <tr><td class="label">QQ</td><td><input type="text" id="qq" value="2095728221"></td></tr>
    <tr><td class="label">请假类型</td><td>
      <select id="leaveType">
        <option value="病假" selected>病假</option>
        <option value="事假">事假</option>
        <option value="其他类型">其他类型</option>
      </select>
    </td></tr>
    <tr><td class="label">请假时限</td><td>
      <input type="date" id="startDate" value="2026-04-01"> 至 
      <input type="date" id="endDate" value="2026-04-01">
    </td></tr>
    <tr><td class="label">请假原因</td><td><textarea id="reason" rows="3">身体不适</textarea></td></tr>
  </table>

  <button onclick="generateProof()">生成证明</button>
</div>

<script>
function generateProof() {
  const html = `<!DOCTYPE html>
<html><head><meta charset=utf-8><title>本科生请销假证明</title><meta name=viewport content="width=device-width,initial-scale=1">
<style>body{font-family:"Microsoft YaHei",sans-serif;background:#f3f3f3;padding:30px;}.container{max-width:820px;margin:auto;background:white;padding:40px;box-shadow:0 4px 20px rgba(0,0,0,0.15);}h1{text-align:center;color:#e63939;}table{width:100%;border-collapse:collapse;margin:25px 0;}td{padding:14px 18px;border:1px solid #bfbfbf;}.label{background:#f8f9fa;font-weight:bold;width:180px;text-align:center;}</style></head><body>
<div class="container">
  <h1>本科学生请销假证明</h1>
  <table>
    <tr><td class="label">学院</td><td>${document.getElementById("college").value}</td></tr>
    <tr><td class="label">姓名</td><td>${document.getElementById("name").value}</td></tr>
    <tr><td class="label">学号</td><td>${document.getElementById("studentId").value}</td></tr>
    <tr><td class="label">专业</td><td>${document.getElementById("major").value}</td></tr>
    <tr><td class="label">班级</td><td>${document.getElementById("class").value}</td></tr>
    <tr><td class="label">年级</td><td>${document.getElementById("grade").value}</td></tr>
    <tr><td class="label">电话</td><td>${document.getElementById("phone").value}</td></tr>
    <tr><td class="label">QQ</td><td>${document.getElementById("qq").value}</td></tr>
    <tr><td class="label">请假类型</td><td>${document.getElementById("leaveType").value}</td></tr>
    <tr><td class="label">请假时限</td><td>${document.getElementById("startDate").value} 至 ${document.getElementById("endDate").value}</td></tr>
    <tr><td class="label">请假原因</td><td>${document.getElementById("reason").value}</td></tr>
  </table>
  <p style="text-align:center;color:#666;margin-top:60px;">此证明由 bzy123.us.ci 生成 • ${new Date().toLocaleDateString('zh-CN')}</p>
</div>
</body></html>`;
  const newWin = window.open("", "_blank");
  newWin.document.write(html);
  newWin.document.close();
}
</script>
</body>
</html>
