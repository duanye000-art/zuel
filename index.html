<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本科生请销假证明</title>
  <style>
    body {font-family: system-ui, sans-serif; background:#f3f3f3; margin:0; padding:20px;}
    .container {max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);}
    h1 {text-align: center; color: #e63939;}
    table {width: 100%; border-collapse: collapse; margin: 20px 0;}
    td {padding: 12px 10px; border: 1px solid #ddd; vertical-align: middle;}
    .label {background: #f8f9fa; font-weight: bold; width: 140px; text-align: center;}
    input, select, textarea {width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box;}
    button {background: #e63939; color: white; padding: 15px 40px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; display: block; margin: 30px auto 0; width: 300px;}
    button:hover {background: #c22a2a;}
  </style>
</head>
<body>
  <div class="container">
    <h1>本科学生请销假证明</h1>
    
    <form id="myForm">
      <table>
        <tr><td class="label">学院</td><td><input type="text" id="college" value="刑事司法学院"></td></tr>
        <tr><td class="label">姓名</td><td><input type="text" id="name" value="段烨"></td></tr>
        <tr><td class="label">学号</td><td><input type="text" id="studentId" value="202421050004"></td></tr>
        <tr><td class="label">专业</td><td><input type="text" id="major" value="侦查学(法庭科学方向)"></td></tr>
        <tr><td class="label">班级</td><td><input type="text" id="class" value="法科2401"></td></tr>
        <tr><td class="label">年级</td><td><input type="text" id="grade" value="2024"></td></tr>
        <tr><td class="label">电话</td><td><input type="text" id="phone" value="19357494523"></td></tr>
        <tr><td class="label">QQ</td><td><input type="text" id="qq" value="2095728221"></td></tr>
        
        <tr><td class="label">请假类型</td>
          <td>
            <select id="leaveType">
              <option value="病假" selected>病假</option>
              <option value="事假">事假</option>
              <option value="其他类型">其他类型</option>
            </select>
          </td>
        </tr>
        
        <tr><td class="label">请假开始日期</td><td><input type="date" id="startDate" value="2026-04-01"></td></tr>
        <tr><td class="label">请假结束日期</td><td><input type="date" id="endDate" value="2026-04-01"></td></tr>
        <tr><td class="label">请假原因</td><td><textarea id="reason" rows="3">身体不适</textarea></td></tr>
      </table>

      <button type="button" onclick="generateProof()">生成证明</button>
    </form>
  </div>

  <script>
    function generateProof() {
      const data = {
        college: document.getElementById("college").value,
        name: document.getElementById("name").value,
        studentId: document.getElementById("studentId").value,
        major: document.getElementById("major").value,
        class: document.getElementById("class").value,
        grade: document.getElementById("grade").value,
        phone: document.getElementById("phone").value,
        qq: document.getElementById("qq").value,
        leaveType: document.getElementById("leaveType").value,
        startDate: document.getElementById("startDate").value,
        endDate: document.getElementById("endDate").value,
        reason: document.getElementById("reason").value
      };

      const proofHTML = `
        <!DOCTYPE html>
        <html><head><meta charset="UTF-8"><title>本科生请销假证明</title>
        <style>
          body{font-family: system-ui, sans-serif; background:#f3f3f3; padding:30px;}
          .container{max-width:800px; margin:auto; background:white; padding:30px; border-radius:8px; box-shadow:0 4px 15px rgba(0,0,0,0.1);}
          h1{text-align:center; color:#e63939;}
          table{width:100%; border-collapse:collapse; margin:20px 0;}
          td{padding:12px; border:1px solid #ddd;}
          .label{background:#f8f9fa; font-weight:bold; width:140px;}
        </style>
        </head><body>
          <div class="container">
            <h1>本科学生请销假证明</h1>
            <table>
              <tr><td class="label">学院</td><td>${data.college}</td></tr>
              <tr><td class="label">姓名</td><td>${data.name}</td></tr>
              <tr><td class="label">学号</td><td>${data.studentId}</td></tr>
              <tr><td class="label">专业</td><td>${data.major}</td></tr>
              <tr><td class="label">班级</td><td>${data.class}</td></tr>
              <tr><td class="label">年级</td><td>${data.grade}</td></tr>
              <tr><td class="label">电话</td><td>${data.phone}</td></tr>
              <tr><td class="label">QQ</td><td>${data.qq}</td></tr>
              <tr><td class="label">请假类型</td><td>${data.leaveType}</td></tr>
              <tr><td class="label">请假时限</td><td>${data.startDate} 至 ${data.endDate}</td></tr>
              <tr><td class="label">请假原因</td><td>${data.reason}</td></tr>
            </table>
            <p style="text-align:center; color:#666; margin-top:40px;">此证明由 bzy123.us.ci 生成 • ${new Date().toLocaleDateString('zh-CN')}</p>
          </div>
        </body></html>
      `;

      const newWindow = window.open();
      newWindow.document.write(proofHTML);
      newWindow.document.close();
    }
  </script>
</body>
</html>
