                 <tr><td style="BORDER-TOP-COLOR:;VERTICAL-ALIGN:middle;PADDING-BOTTOM:5px;PADDING-TOP:5px;PADDING-LEFT:5px;PADDING-RIGHT:5px"><div align=center><font size=3>审核日期</font></div></td>
                 <td colspan=2 style="BORDER-TOP-COLOR:;VERTICAL-ALIGN:middle;PADDING-BOTTOM:5px;PADDING-TOP:5px;PADDING-LEFT:5px;PADDING-RIGHT:5px"><div class="infoplus_labelControlContainer inline"><div style='FONT-SIZE:small;font-family:"PingFang SC",微软雅黑;WIDTH:100%' class="infoplus_control infoplus_labelControl inline" id=v_review_date></div></div></td></tr>

                 <tr><td colspan=3 style="BORDER-TOP-COLOR:;VERTICAL-ALIGN:middle;BORDER-BOTTOM:#bfbfbf 6pt solid;PADDING-BOTTOM:5px;PADDING-TOP:5px;PADDING-LEFT:5px;BORDER-RIGHT-COLOR:;PADDING-RIGHT:5px">
                  <div align=center><div id=qrcode_container style="width:116px;height:116px;display:flex;align-items:center;justify-content:center;"></div></div>
                 </td></tr>

                </tbody>
               </table>
              </div>
             </td>
            </tr>
           </tbody>
          </table>
         </div>
        </div>
       </div>
      </div>
     </div>
    </div>
   </div>
  </div>
 </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

<script>
function setText(id, val) { var el=document.getElementById(id); if(el) el.textContent=val||''; }
function showFileError() {
  var t=document.getElementById('file_error_toast'); if(t){t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
}
function esc(s){return !s?'':s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderCourses(courses){
  var area=document.getElementById('kc_render_area');
  if(!courses||courses.length===0) return;
  var html='';
  courses.forEach(c=>{
    html+=`<div class="kc-block-view"><div align=left style="MARGIN-BOTTOM:0px;WIDTH:100%"><div align=center><table border=1 bordercolor=buttontext style="WORD-WRAP:break-word;BORDER-TOP:medium none;BORDER-RIGHT:medium none;WIDTH:288px;BORDER-COLLAPSE:collapse;TABLE-LAYOUT:fixed;BORDER-BOTTOM:medium none;BORDER-LEFT:medium none" class=xdLayout><colgroup><col width=144><col width=144></colgroup><tbody><tr><td style="VERTICAL-ALIGN:middle;PADDING:5px;text-align:center"><font size=3>课程时间</font></td><td style="VERTICAL-ALIGN:middle;PADDING:5px"><div style="font-size:small;font-family:PingFang SC,微软雅黑">${esc(c.time)}</div></td></tr><tr><td style="VERTICAL-ALIGN:middle;PADDING:5px;text-align:center"><font size=3>课程节次</font></td><td style="VERTICAL-ALIGN:middle;PADDING:5px"><div style="font-size:small;font-family:PingFang SC,微软雅黑">${esc(c.jie)}</div></td></tr><tr><td style="VERTICAL-ALIGN:middle;PADDING:5px;text-align:center"><font size=3>请假课程</font></td><td style="VERTICAL-ALIGN:middle;PADDING:5px"><div style="font-size:small;font-family:PingFang SC,微软雅黑">${esc(c.name)}</div></td></tr><tr><td style="VERTICAL-ALIGN:middle;PADDING:5px;text-align:center"><font size=3>任课老师</font></td><td style="VERTICAL-ALIGN:middle;PADDING:5px"><div style="font-size:small;font-family:PingFang SC,微软雅黑">${esc(c.teacher)}</div></td></tr></tbody></table></div></div></div>`;
  });
  area.innerHTML=html;
}

const KEY_MAP={a:'xueyuan',b:'xingming',c:'xuehao',d:'zhuanye',e:'banji',f:'nianji',g:'dianhua',h:'qq',i:'bzphone',j:'qjlx',k:'date_start',l:'date_end',m:'days',n:'reason',p:'lxr_name',q:'lxr_phone',r:'lxr_addr',s:'lxr_rel',t:'fdyyjian',u:'reviewer',v:'review_date',w:'file_name',x:'file_size',kc:'courses'};

(function(){
  const params=new URLSearchParams(window.location.search);
  const z=params.get('z');
  let data=null;

  try{
    if(z){
      const json=LZString.decompressFromEncodedURIComponent(z);
      const raw=JSON.parse(json);
      data={};
      Object.keys(raw).forEach(k=>{
        const full=KEY_MAP[k]||k;
        data[full]=raw[k];
      });
    }else{
      document.body.innerHTML='<div style="text-align:center;padding:80px;color:#c00;font-size:16px;">链接无效，请重新生成。</div>';
      return;
    }
  }catch(e){
    document.body.innerHTML='<div style="text-align:center;padding:80px;color:#c00;font-size:16px;">数据解析失败，请重新生成链接。</div>';
    return;
  }

  // 渲染
  setText('v_xueyuan',data.xueyuan);
  setText('v_xingming',data.xingming);
  setText('v_xuehao',data.xuehao);
  setText('v_zhuanye',data.zhuanye);
  setText('v_banji',data.banji);
  setText('v_nianji',data.nianji);
  setText('v_dianhua',data.dianhua);
  setText('v_qq',data.qq);
  setText('v_bzphone',data.bzphone);
  setText('v_date_start',data.date_start);
  setText('v_date_end',data.date_end);
  setText('v_days',data.days);
  setText('v_reason',data.reason);
  setText('v_lxr_name',data.lxr_name);
  setText('v_lxr_phone',data.lxr_phone);
  setText('v_lxr_addr',data.lxr_addr);
  setText('v_lxr_rel',data.lxr_rel);
  setText('v_fdyyjian',data.fdyyjian);
  setText('v_reviewer',data.reviewer);
  setText('v_review_date',data.review_date);

  setText('v_file_name',data.file_name||'IMG_2766.jpeg');
  setText('v_file_size',data.file_size?'('+data.file_size+')':'');

  renderCourses(data.courses||[]);

  const qjlxMap={'事假':'V0_CTRL17','病假':'V0_CTRL13','其他类型':'V0_CTRL14'};
  const rid=qjlxMap[data.qjlx];
  if(rid){
    const r=document.getElementById(rid);
    if(r){r.checked=true; r.classList.add('checked');}
  }

  if(data.xingming) document.title='本科学生请销假证明 - '+data.xingming;

  // 生成二维码（使用当前压缩后的短链接）
  const qrContainer=document.getElementById('qrcode_container');
  new QRCode(qrContainer,{
    text: window.location.href,
    width: 116,
    height: 116,
    colorDark:"#000000",
    colorLight:"#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });
})();
</script>
</body>
</html>
