<body>
<div id=div_render_container style=display:block>
 <form id=renderForm>
  <!-- 你的原表格内容保持不变（从这里开始到二维码前） -->
  <div id=div_content class=div_content>
   <div id=renderContent_holder class=no_header>
    <div id=render_holder>
     <div id=form_holder>
      <div class=infoplus_view_wrap_outer>
       <div class=infoplus_view_wrap_inner>
        <div class=infoplus_view>
         <div align=center>
          <table style="BORDER-TOP-STYLE:none;WORD-WRAP:break-word;BORDER-LEFT-STYLE:none;WIDTH:320px;BORDER-COLLAPSE:collapse;TABLE-LAYOUT:fixed;BORDER-BOTTOM-STYLE:none;BORDER-RIGHT-STYLE:none" class=xdFormLayout>
           <!-- 你的原表格内容（太长，我这里省略显示，但请保留你原来的全部表格HTML） -->
           <!-- ...（从 <tbody> 到二维码前的内容全部保持你原来的）... -->
           <!-- 注意：请把你原来的整个表格部分直接粘贴到这里，保持不变 -->
          </table>
         </div>
        </div>
       </div>
      </div>
     </div>
    </div>
   </div>
  </div>
 </form>

 <div id=master_footer>
  <div style=height:1px;background-color:#999999></div>
  <div style=height:1px;background-color:#FFFFFF></div>
  <div id=div_footer_copy_content><span class=copyright>©</span> 2009 - 2021. 中南财经政法大学(zuel.edu.cn), All rights reserved. Version 20210410-054026</div>
 </div>
</div>

<!-- QRCode library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- LZ-String -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

<script>
// ==================== 你的原渲染函数保持不变 ====================
function setText(id, val) {
  var el = document.getElementById(id);
  if (el) el.textContent = val || '';
}

function showFileError() {
  var toast = document.getElementById('file_error_toast');
  if (!toast) return;
  toast.style.display = 'block';
  setTimeout(function(){ toast.style.display = 'none'; }, 2500);
}

function renderCourses(courses) {
  var area = document.getElementById('kc_render_area');
  if (!courses || courses.length === 0) return;
  var html = '';
  courses.forEach(function(c, i) {
    html += `<div class="kc-block-view"><div align=left style="MARGIN-BOTTOM:0px;WIDTH:100%"><div align=center><table border=1 bordercolor=buttontext style="WORD-WRAP:break-word;BORDER-TOP:medium none;BORDER-RIGHT:medium none;WIDTH:288px;BORDER-COLLAPSE:collapse;TABLE-LAYOUT:fixed;BORDER-BOTTOM:medium none;BORDER-LEFT:medium none" class=xdLayout><colgroup><col width=144 style=WIDTH:144px><col width=144 style=WIDTH:144px></colgroup><tbody><tr><td style="VERTICAL-ALIGN:middle;PADDING:5px;text-align:center"><font size=3>课程时间</font></td><td style="VERTICAL-ALIGN:middle;PADDING:5px"><div style="font-size:small;font-family:PingFang SC,微软雅黑">${esc(c.time)}</div></td></tr><tr><td style="VERTICAL-ALIGN:middle;PADDING:5px;text-align:center"><font size=3>课程节次</font></td><td style="VERTICAL-ALIGN:middle;PADDING:5px"><div style="font-size:small;font-family:PingFang SC,微软雅黑">${esc(c.jie)}</div></td></tr><tr><td style="VERTICAL-ALIGN:middle;PADDING:5px;text-align:center"><font size=3>请假课程</font></td><td style="VERTICAL-ALIGN:middle;PADDING:5px"><div style="font-size:small;font-family:PingFang SC,微软雅黑">${esc(c.name)}</div></td></tr><tr><td style="VERTICAL-ALIGN:middle;PADDING:5px;text-align:center"><font size=3>任课老师</font></td><td style="VERTICAL-ALIGN:middle;PADDING:5px"><div style="font-size:small;font-family:PingFang SC,微软雅黑">${esc(c.teacher)}</div></td></tr></tbody></table></div></div></div>`;
  });
  area.innerHTML = html;
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ==================== 短键映射（大幅缩短长度） ====================
const KEY_MAP = {
  a:'xueyuan', b:'xingming', c:'xuehao', d:'zhuanye', e:'banji',
  f:'nianji',  g:'dianhua',  h:'qq',     i:'bzphone', j:'qjlx',
  k:'date_start', l:'date_end', m:'days', n:'reason',
  p:'lxr_name', q:'lxr_phone', r:'lxr_addr', s:'lxr_rel',
  t:'fdyyjian', u:'reviewer', v:'review_date',
  w:'file_name', x:'file_size', kc:'courses'
};

// ==================== 生成短链接函数（核心优化） ====================
function generateShortLink(data) {
  // 转为短键
  const shortData = {};
  Object.keys(data).forEach(key => {
    const shortKey = Object.keys(KEY_MAP).find(k => KEY_MAP[k] === key) || key;
    shortData[shortKey] = data[key];
  });

  const jsonStr = JSON.stringify(shortData, null, 0);  // 紧凑格式
  const compressed = LZString.compressToEncodedURIComponent(jsonStr);
  
  const base = window.location.origin + window.location.pathname;
  return `${base}?z=${compressed}`;
}

// ==================== 页面加载解压渲染 ====================
(function() {
  const params = new URLSearchParams(window.location.search);
  const z = params.get('z');
  const d = params.get('d');   // 兼容旧版

  let data = null;

  try {
    if (z) {
      const json = LZString.decompressFromEncodedURIComponent(z);
      const raw = JSON.parse(json);
      data = {};
      Object.keys(raw).forEach(k => {
        const fullKey = KEY_MAP[k] || k;
        data[fullKey] = raw[k];
      });
    } else if (d) {
      // 旧格式兼容
      const json2 = decodeURIComponent(escape(atob(decodeURIComponent(d))));
      data = JSON.parse(json2);
    } else {
      document.body.innerHTML = '<div style="text-align:center;padding:60px;color:#c00;font-size:16px;">链接无效，请重新生成。</div>';
      return;
    }
  } catch(e) {
    document.body.innerHTML = '<div style="text-align:center;padding:60px;color:#c00;font-size:16px;">数据解析失败，请重新生成链接。</div>';
    return;
  }

  // 渲染所有字段（保持你原来的逻辑）
  setText('v_xueyuan', data.xueyuan);
  setText('v_xingming', data.xingming);
  setText('v_xuehao', data.xuehao);
  setText('v_zhuanye', data.zhuanye);
  setText('v_banji', data.banji);
  setText('v_nianji', data.nianji);
  setText('v_dianhua', data.dianhua);
  setText('v_qq', data.qq);
  setText('v_bzphone', data.bzphone);
  setText('v_date_start', data.date_start);
  setText('v_date_end', data.date_end);
  setText('v_days', data.days);
  setText('v_reason', data.reason);
  setText('v_lxr_name', data.lxr_name);
  setText('v_lxr_phone', data.lxr_phone);
  setText('v_lxr_addr', data.lxr_addr);
  setText('v_lxr_rel', data.lxr_rel);
  setText('v_fdyyjian', data.fdyyjian);
  setText('v_reviewer', data.reviewer);
  setText('v_review_date', data.review_date);

  const fname = data.file_name || 'IMG_2766.jpeg';
  const fsize = data.file_size || '233.3K';
  setText('v_file_name', fname);
  setText('v_file_size', '(' + fsize + ')');

  renderCourses(data.courses || data.kc || []);

  // 请假类型
  const qjlxMap = { '事假': 'V0_CTRL17', '病假': 'V0_CTRL13', '其他类型': 'V0_CTRL14' };
  const targetRadio = qjlxMap[data.qjlx];
  if (targetRadio) {
    const r = document.getElementById(targetRadio);
    if (r) { r.checked = true; r.classList.add('checked'); }
  }

  if (data.xingming) document.title = '本科学生请销假证明 - ' + data.xingming;

  // 生成二维码（当前链接）
  const qrContainer = document.getElementById('qrcode_container');
  if (typeof QRCode !== 'undefined') {
    new QRCode(qrContainer, {
      text: window.location.href,
      width: 116, height: 116,
      colorDark: '#000000', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  // ==================== 新增：复制分享链接按钮 ====================
  const shareBtn = document.createElement('div');
  shareBtn.id = 'share_btn';
  shareBtn.innerHTML = '📋 复制分享链接（已优化更短）';
  document.body.appendChild(shareBtn);

  shareBtn.addEventListener('click', () => {
    const shortUrl = generateShortLink(data);
    navigator.clipboard.writeText(shortUrl).then(() => {
      shareBtn.innerHTML = '✅ 已复制！';
      setTimeout(() => { shareBtn.innerHTML = '📋 复制分享链接（已优化更短）'; }, 2000);
    });
  });
})();
</script>
</body>
